<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifiesto de carga</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { background: var(--paper); }
  .m-toolbar {
    position: sticky; top: 0; z-index: 10; background: var(--rail); color: #fff;
    padding: 12px 16px; display: flex; justify-content: center; gap: 10px;
  }
  .m-toolbar button {
    background: var(--moss); color: var(--moss-on); border: none; border-radius: 6px;
    padding: 9px 18px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: var(--font-body);
  }
  #m-content { display: flex; justify-content: center; padding: 20px 0 40px; }
  #m-content .doc { box-shadow: 0 2px 20px rgba(0,0,0,0.14); }
  #m-status { text-align: center; padding: 60px 20px; color: var(--ink-muted); font-family: var(--font-body); }
  @media print {
    .m-toolbar { display: none; }
    body { background: #fff; }
    #m-content { padding: 0; }
    #m-content .doc { box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="m-toolbar">
    <button id="btn-m-print">🖨️ Imprimir / Guardar como PDF</button>
  </div>
  <div id="m-status">Cargando manifiesto…</div>
  <div id="m-content"></div>

  <script src="js/manifiesto-template.js"></script>
  <script>
    async function init() {
      const id = new URLSearchParams(location.search).get("id");
      const status = document.getElementById("m-status");
      if (!id) { status.textContent = "Falta el número de manifiesto en el link."; return; }
      try {
        const [r, generadores, emp] = await Promise.all([
          fetch(`/api/remisiones/${id}`).then(res => { if (!res.ok) throw new Error("not found"); return res.json(); }),
          fetch("/api/generadores/").then(res => res.json()),
          fetch("/api/empresa/").then(res => res.json()),
        ]);
        const g = generadores.find(x => x.id === r.generador_id) || null;
        document.title = `Manifiesto N.° ${r.consecutivo} — ${emp.nombre || "Remisiones"}`;
        status.remove();
        document.getElementById("m-content").innerHTML = buildManifiestoHtml(r, g, emp);
      } catch (e) {
        status.textContent = "No se encontró ese manifiesto. Puede que el link esté vencido o mal escrito.";
      }
    }
    document.getElementById("btn-m-print").addEventListener("click", () => window.print());
    init();
  </script>
</body>
</html>
